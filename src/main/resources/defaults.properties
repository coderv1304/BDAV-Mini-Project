# Shipped defaults for the text-analytics platform.
# Precedence: explicit -D on the command line > this file > Hadoop site config.
# Every key here is also documented in docs/01-architecture.md.

# ---- analysis parameters ---------------------------------------------------
ta.topn.n=100
ta.topn.strategy=heap
ta.ngram.n=2
ta.ngram.minfreq=2
ta.ngram.padding=true
ta.min.token.length=1
ta.number.mode=mask
ta.cooccur.window=5
ta.cooccur.ordered=true
ta.cooccur.mincount=2
ta.cooccur.topk=20
ta.tf.mode=log
ta.corpus.ndocs=0
ta.sim.min.shared=3
ta.sim.top.terms=50

# ---- engineering knobs -----------------------------------------------------
# combine.mode: none | combiner | inmapper | both
ta.combine.mode=combiner
# codec: none | snappy | lz4 | gzip | bzip2  (unsupported codecs fall back with a warning)
ta.codec=none
# output.format: seq | text - INTENTIONALLY UNSET.
# Each stage declares its own correct default (chained stages -> seq, terminal stages ->
# text). Setting this globally would silently break chaining: a word-count written as
# text cannot be read back by the SequenceFileInputFormat the next stage uses.
# ta.output.format=text
ta.overwrite=false
ta.reducers=4
ta.smallfile.threshold=33554432
ta.numeric.format=%.6f

# ---- input paths (no absolute paths baked into code) -----------------------
ta.stopwords.path=
ta.lexicon.path=

# ---- pipeline orchestration ------------------------------------------------
# core = analytics stages only, all = also run optional/bonus stages
ta.pipeline.stages=core
# delete 07a/07b intermediates after the TF-IDF join consumed them
ta.cleanup.intermediate=false
# upper bound for the parallel co-occurrence branch (JobControl)
ta.pipeline.jobcontrol.budget.seconds=14400

# ---- job tuning ------------------------------------------------------------
mapreduce.task.io.sort.mb=200
mapreduce.task.io.sort.factor=50
mapreduce.map.speculative=false
mapreduce.reduce.speculative=false
