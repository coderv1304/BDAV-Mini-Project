# Logging for the platform. SLF4J is bound to reload4j (log4j 1.2 API), which is
# what Hadoop 3.3.x ships, so this file configures both our code and Hadoop's.
log4j.rootLogger=WARN, console

log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.target=System.err
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{ISO8601} %-5p %c{1} - %m%n

# Our own packages are the interesting ones.
log4j.logger.edu.bdav.ta=INFO

# Hadoop is extremely chatty at INFO during job submission.
log4j.logger.org.apache.hadoop=WARN
log4j.logger.org.apache.hadoop.mapreduce.Job=INFO
log4j.logger.org.apache.hadoop.util.NativeCodeLoader=ERROR
log4j.logger.org.apache.hadoop.io.compress=ERROR
